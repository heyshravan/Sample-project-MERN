<!DOCTYPE html>
<html lang="en">
<head>
</head>
<body>
    <h1>Function concept</h1>
    <script>
        //Javascript Function
        const pi=3.14;
        function area_of_circle(r){
            return pi*r*r;
        }
        console.log(area_of_circle(5))
        //arrow functions
        const area_of_cylinder=(r,h)=>{return 2*pi*r*h;}
        console.log(area_of_cylinder(5,3))
    </script>
</body>
</html>
