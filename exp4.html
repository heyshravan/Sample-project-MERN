<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exp 4</title>
</head>
<body>
    <input id="name" type="text" placeholder="Enter name">
    <p id="res">Output here</p>
    <button id="btn1">Convert Uppercase Button</button>
    <script>
        document.getElementById("btn1").addEventListener('click',
        function(){
            let name=document.getElementById("name").value;
            document.getElementById("res").innerHTML=name.toUpperCase();
        })
    </script>
</body>
</html>
