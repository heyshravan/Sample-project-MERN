<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exp 6</title>
</head>
<body>
    <input id="a" type="text" placeholder="Enter Name">
    <p id ="b"> Output come here</p>
    <script>
        document.getElementById("a").addEventListener('keyup',function(){
        let name=document.getElementById("a").value;
        document.getElementById("b").innerHTML=name.toUpperCase();
        })
    </script>
</body>
</html>
